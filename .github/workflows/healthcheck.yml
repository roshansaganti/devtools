name: Healthchecks

on:
  # For testing
  # pull_request:
  #   branches:
  #     - master
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  mysql:
    runs-on: ubuntu-latest
    container:
      image: mariadb:11.4
    timeout-minutes: 5
    steps:
      - name: Ping MySQL
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SSL_CA: ${{ secrets.SSL_CA }}
        run: |
          printf '%s\n' "$SSL_CA" > "$RUNNER_TEMP/ca.pem"
          mariadb --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASS" --connect-timeout=15 --ssl --ssl-ca="$RUNNER_TEMP/ca.pem" --ssl-verify-server-cert "$DB_NAME" --execute='SELECT 1;'
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Django
        env:
          BACKEND_API: ${{ secrets.BACKEND_API }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 --output /dev/null --write-out 'HTTP %{http_code} in %{time_total}s\n' "$BACKEND_API"
  notify:
    if: false
    # Job will run if either job succeeds
    needs: [mysql]
    # if: always()

    name: "Notify"
    runs-on: ubuntu-latest
    permissions:
      actions: "read"
      contents: "read"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MySQL Healthcheck
      - name: Send failure notification
        if: needs.mysql.result == 'failure'
        uses: ./.github/actions/notify
        with:
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          target_job_id: "mysql"
          github_token: ${{ github.token }}
          title: ""
          color: "16711680"
          description: ":x: **FAILED to connect to MySQL!**"
          discord_username: "GitHub Actions"
          discord_avatar: "https://cdn.pixabay.com/photo/2017/08/05/11/24/logo-2582757_1280.png"
          author_icon_url: "https://cdn.pixabay.com/photo/2017/08/05/11/24/logo-2582757_1280.png"
          image_url: "https://cdn.pixabay.com/photo/2024/08/11/14/14/error-8961541_1280.png"
          footer_text: "MySQL Healthcheck"
          footer_icon_url: "https://cdn.pixabay.com/photo/2017/08/05/11/24/logo-2582757_1280.png"