name: MySQL healthcheck

on:
  # For testing
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  mysql:
    runs-on: ubuntu-latest
    container:
      image: mariadb:11.4
    timeout-minutes: 5
    steps:
      - name: Ping MySQL
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          MYSQL_PWD: ${{ secrets.DB_PASS }}
        run: mariadb --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --connect-timeout=15 --ssl "$DB_NAME" --execute='SELECT 1;'
  notify:
    # Job will run if either job succeeds
    needs: [mysql]
    if: always()

    name: "Notify"
    runs-on: ubuntu-latest
    permissions:
      actions: "read"
      contents: "read"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MySQL Healthcheck
      - name: Send failure notification
        if: needs.mysql.result == 'failure'
        uses: ./.github/actions/notify
        with:
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          target_job_id: "mysql"
          github_token: ${{ github.token }}
          title: ""
          color: "16711680"
          description: ":x: **FAILED to connect to MySQL!**"
          discord_username: "GitHub Actions"
          discord_avatar: "https://cdn.pixabay.com/photo/2017/08/05/11/24/logo-2582757_1280.png"
          author_icon_url: "https://cdn.pixabay.com/photo/2017/08/05/11/24/logo-2582757_1280.png"
          image_url: "https://cdn.pixabay.com/photo/2024/08/11/14/14/error-8961541_1280.png"
          footer_text: "MySQL Healthcheck"
          footer_icon_url: "https://cdn.pixabay.com/photo/2017/08/05/11/24/logo-2582757_1280.png"